name: Build & Release Meridian

on:
  push:
    branches: [main]
    tags: 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install extension dependencies
        working-directory: extensions/meridian
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Download Neutralino client library and template resources
        run: |
          mkdir -p resources/js resources/icons
          curl -sL -o resources/js/neutralino.js \
            "https://cdn.jsdelivr.net/npm/@neutralinojs/lib@6.8.0/dist/neutralino.js"
          curl -sL -o resources/js/neutralino.d.ts \
            "https://cdn.jsdelivr.net/npm/@neutralinojs/lib@6.8.0/dist/neutralino.d.ts"
          curl -sL -o resources/icons/appIcon.png \
            "https://raw.githubusercontent.com/neutralinojs/neutralinojs-minimal/main/resources/icons/appIcon.png"

      - name: Build production binary
        run: npm run dist

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-${{ matrix.os }}
          path: |
            dist/Meridian*
            dist/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Meridian*
            dist/*.exe
          generate_release_notes: true
