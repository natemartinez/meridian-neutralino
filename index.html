<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    CSP note: script-src intentionally omits 'unsafe-inline' and 'unsafe-eval'.
    The production build emits only external <script src> tags, so no inline
    script allowance is needed. Vite's dev server injects an inline preamble,
    so the dev plugin (vite.config.js) relaxes script-src to include
    'unsafe-inline' ONLY under `vite` (never under `vite build`).
    See the cspDev plugin in vite.config.js.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    connect-src 'self' https://openrouter.ai;
    img-src 'self' data:;
    font-src 'self' data: https://fonts.gstatic.com;
  ">
  <link rel="icon" type="image/png" href="/src/assets/meridian_icon.png" />
  <title>Meridian</title>
  <!-- Neutralino globals injected by the server at runtime (must load before app) -->
  <script src="__neutralino_globals.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
